<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#222}
    .t{font-size:18px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#666}
    .m{font-family:Menlo,Consolas,monospace;font-size:13px}.r{fill:#b3261e}
  </style>
  <rect width="960" height="400" fill="#fff"/>

  <!-- ① $lookup -->
  <text x="170" y="36" text-anchor="middle" class="t">① DB에서 조인 ($lookup)</text>
  <rect x="80" y="62" width="180" height="50" rx="12" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="170" y="93" text-anchor="middle" class="b">애플리케이션</text>
  <line x1="170" y1="112" x2="170" y2="166" stroke="#888" marker-end="url(#a)"/>
  <text x="180" y="144" class="s">aggregate 1번</text>
  <rect x="30" y="170" width="280" height="150" rx="14" fill="none" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="44" y="192" class="s">몽고DB</text>
  <rect x="48" y="210" width="100" height="44" rx="10" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="98" y="237" text-anchor="middle" class="m">orders</text>
  <rect x="192" y="210" width="100" height="44" rx="10" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="242" y="237" text-anchor="middle" class="m">customers</text>
  <line x1="190" y1="232" x2="150" y2="232" stroke="#b3261e" marker-end="url(#ar)"/>
  <text x="170" y="276" text-anchor="middle" class="m r">$lookup</text>
  <text x="170" y="302" text-anchor="middle" class="s">주문 + customer 배열로 반환</text>
  <text x="170" y="352" text-anchor="middle" class="b">조인 위치: <tspan font-weight="700">DB</tspan> · 읽을 때</text>
  <text x="170" y="376" text-anchor="middle" class="s">foreignField 인덱스 필요</text>

  <!-- ② 앱 조인 -->
  <text x="490" y="36" text-anchor="middle" class="t">② 앱에서 조인</text>
  <rect x="400" y="62" width="180" height="50" rx="12" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="490" y="84" text-anchor="middle" class="b">애플리케이션</text>
  <text x="490" y="103" text-anchor="middle" class="s">③ id로 메모리에서 매칭</text>
  <line x1="440" y1="112" x2="418" y2="206" stroke="#888" marker-end="url(#a)"/>
  <line x1="540" y1="112" x2="562" y2="206" stroke="#888" marker-end="url(#a)"/>
  <text x="372" y="160" class="s">① find</text>
  <text x="560" y="160" class="s">② $in</text>
  <rect x="350" y="170" width="280" height="150" rx="14" fill="none" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="364" y="192" class="s">몽고DB</text>
  <rect x="368" y="210" width="100" height="44" rx="10" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="418" y="237" text-anchor="middle" class="m">orders</text>
  <rect x="512" y="210" width="100" height="44" rx="10" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="562" y="237" text-anchor="middle" class="m">customers</text>
  <text x="490" y="290" text-anchor="middle" class="s">Mongoose populate()도 이 방식</text>
  <text x="490" y="352" text-anchor="middle" class="b">조인 위치: <tspan font-weight="700">앱</tspan> · 읽을 때</text>
  <text x="490" y="376" text-anchor="middle" class="s">왕복 2번+, 하나씩 조회하면 N+1</text>

  <!-- ③ 복사 -->
  <text x="810" y="36" text-anchor="middle" class="t">③ 쓸 때 복사 (비정규화)</text>
  <rect x="720" y="62" width="180" height="50" rx="12" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="810" y="93" text-anchor="middle" class="b">애플리케이션</text>
  <line x1="810" y1="112" x2="810" y2="186" stroke="#888" marker-end="url(#a)"/>
  <text x="820" y="144" class="s">find 1번</text>
  <rect x="670" y="170" width="280" height="150" rx="14" fill="none" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="684" y="192" class="s">몽고DB</text>
  <rect x="690" y="190" width="240" height="56" rx="10" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="810" y="212" text-anchor="middle" class="m">message 문서</text>
  <text x="810" y="234" text-anchor="middle" class="m r">author: { id, name }</text>
  <rect x="690" y="272" width="240" height="36" rx="10" fill="#fff" stroke="#888"/>
  <text x="810" y="295" text-anchor="middle" class="m">authors (원본)</text>
  <line x1="760" y1="272" x2="760" y2="248" stroke="#b3261e" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="770" y="265" class="s r">변경 시 복사</text>
  <text x="810" y="352" text-anchor="middle" class="b">조인 위치: <tspan font-weight="700">없음</tspan> · 쓸 때 복사</text>
  <text x="810" y="376" text-anchor="middle" class="s">대신 원본과 동기화가 내 책임</text>
</svg>
