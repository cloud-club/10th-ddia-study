<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#222}
    .t{font-size:17px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#666}
    .m{font-family:Menlo,Consolas,monospace;font-size:13px}.r{fill:#b3261e}
  </style>
  <rect width="960" height="330" fill="#fff"/>

  <text x="20" y="32" class="t">PostgreSQL: 힙 + 색인</text>
  <text x="500" y="32" class="t">InnoDB: 테이블이 곧 PK 색인</text>
  <line x1="480" y1="16" x2="480" y2="316" stroke="#eee"/>

  <!-- PostgreSQL -->
  <rect x="30" y="70" width="180" height="60" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="120" y="95" text-anchor="middle" class="b">PK 색인 (id)</text>
  <text x="120" y="118" text-anchor="middle" class="m">7 → (0,1)</text>
  <rect x="30" y="190" width="180" height="60" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="120" y="215" text-anchor="middle" class="b">보조 색인 (email)</text>
  <text x="120" y="238" text-anchor="middle" class="m">bob@x → (0,1)</text>
  <rect x="285" y="60" width="175" height="200" rx="8" fill="#fff" stroke="#d4d4d4"/>
  <text x="372" y="86" text-anchor="middle" class="b">힙 = 테이블</text>
  <text x="300" y="125" class="m r">(0,1) id=7 bob</text>
  <text x="300" y="155" class="m">(0,2) id=3 amy</text>
  <text x="300" y="185" class="m">(1,1) id=5 kim</text>
  <text x="372" y="242" text-anchor="middle" class="s">들어온 순서대로 쌓임</text>
  <g stroke="#888" marker-end="url(#a)">
    <line x1="212" y1="100" x2="290" y2="118"/>
    <line x1="212" y1="220" x2="290" y2="128"/>
  </g>
  <text x="30" y="300" class="s">모든 색인이 행의 물리 위치(ctid)를 가리킨다</text>

  <!-- InnoDB -->
  <rect x="500" y="130" width="190" height="60" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="595" y="155" text-anchor="middle" class="b">보조 색인 (email)</text>
  <text x="595" y="178" text-anchor="middle" class="m">bob@x → id=7</text>
  <rect x="745" y="60" width="195" height="200" rx="8" fill="#fff" stroke="#d4d4d4"/>
  <text x="842" y="86" text-anchor="middle" class="b">PK 색인 = 테이블</text>
  <text x="765" y="125" class="m">id=3 amy</text>
  <text x="765" y="155" class="m">id=5 kim</text>
  <text x="765" y="185" class="m r">id=7 bob</text>
  <text x="842" y="242" text-anchor="middle" class="s">B+ 트리 리프에 행 전체</text>
  <line x1="692" y1="160" x2="760" y2="180" stroke="#888" marker-end="url(#a)"/>
  <text x="716" y="150" text-anchor="middle" class="s">PK 값</text>
  <text x="500" y="300" class="s">행이 PK 순서로 붙어 있고, 보조 색인은 PK를 거쳐 행을 찾는다</text>
</svg>
