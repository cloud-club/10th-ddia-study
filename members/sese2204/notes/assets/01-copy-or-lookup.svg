<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#222}
    .t{font-size:15px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#666}
    .m{font-family:Menlo,Consolas,monospace;font-size:13px}.r{fill:#b3261e}
  </style>
  <rect width="960" height="330" fill="#fff"/>

  <!-- 질문 -->
  <rect x="20" y="40" width="220" height="60" rx="30" fill="#fff" stroke="#222"/>
  <text x="130" y="66" text-anchor="middle" class="t">그 필드를 문서와</text>
  <text x="130" y="86" text-anchor="middle" class="t">거의 항상 같이 읽나?</text>

  <rect x="320" y="40" width="220" height="60" rx="30" fill="#fff" stroke="#222"/>
  <text x="430" y="76" text-anchor="middle" class="t">그 필드가 자주 바뀌나?</text>

  <rect x="620" y="40" width="300" height="60" rx="30" fill="#fff" stroke="#222"/>
  <text x="770" y="66" text-anchor="middle" class="t">그 필드로 필터·집계를</text>
  <text x="770" y="86" text-anchor="middle" class="t">자주 하나? (예: 부서별 작성 수)</text>

  <line x1="240" y1="70" x2="316" y2="70" stroke="#888" marker-end="url(#a)"/>
  <text x="278" y="62" text-anchor="middle" class="s">예</text>
  <line x1="540" y1="70" x2="616" y2="70" stroke="#888" marker-end="url(#a)"/>
  <text x="578" y="62" text-anchor="middle" class="s">아니오</text>

  <!-- 결과 -->
  <line x1="130" y1="100" x2="130" y2="196" stroke="#888" marker-end="url(#a)"/>
  <text x="140" y="152" class="s">아니오</text>
  <rect x="20" y="200" width="220" height="90" rx="12" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="130" y="230" text-anchor="middle" class="t">id만 참조</text>
  <text x="130" y="254" text-anchor="middle" class="s">필요할 때 $lookup</text>
  <text x="130" y="274" text-anchor="middle" class="s">또는 앱 조인</text>

  <line x1="430" y1="100" x2="430" y2="196" stroke="#888" marker-end="url(#a)"/>
  <text x="440" y="152" class="s">예</text>
  <rect x="320" y="200" width="220" height="90" rx="12" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="430" y="230" text-anchor="middle" class="t">복사하지 않음</text>
  <text x="430" y="254" text-anchor="middle" class="s">updateMany 비용이 커짐</text>
  <text x="430" y="274" text-anchor="middle" class="s">읽을 때 $lookup</text>

  <line x1="690" y1="100" x2="690" y2="196" stroke="#888" marker-end="url(#a)"/>
  <text x="700" y="152" class="s">아니오</text>
  <rect x="620" y="200" width="140" height="90" rx="12" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="690" y="230" text-anchor="middle" class="t r">확장 참조</text>
  <text x="690" y="254" text-anchor="middle" class="s">id + 필드 복사</text>
  <text x="690" y="274" text-anchor="middle" class="s">지금 방식</text>

  <line x1="850" y1="100" x2="850" y2="196" stroke="#888" marker-end="url(#a)"/>
  <text x="860" y="152" class="s">예</text>
  <rect x="780" y="200" width="140" height="90" rx="12" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="850" y="230" text-anchor="middle" class="t">집계용 컬렉션</text>
  <text x="850" y="254" text-anchor="middle" class="s">$merge로</text>
  <text x="850" y="274" text-anchor="middle" class="s">미리 계산</text>
</svg>
