<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#222}
    .t{font-size:17px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#666}
    .r{fill:#b3261e}
  </style>
  <rect width="960" height="330" fill="#fff"/>

  <text x="20" y="32" class="t">쓰기 (w=2): 노드 C가 죽어 있다</text>
  <text x="500" y="32" class="t">읽기 (r=2): 노드 A의 응답이 늦다</text>
  <line x1="480" y1="16" x2="480" y2="316" stroke="#eee"/>

  <!-- 쓰기 -->
  <rect x="30" y="139" width="120" height="46" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="90" y="167" text-anchor="middle" class="b">클라이언트</text>

  <rect x="280" y="56" width="180" height="56" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="370" y="80" text-anchor="middle" class="b">노드 A</text>
  <text x="370" y="100" text-anchor="middle" class="s">v7 저장, 확인 응답</text>

  <rect x="280" y="134" width="180" height="56" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="370" y="158" text-anchor="middle" class="b">노드 B</text>
  <text x="370" y="178" text-anchor="middle" class="s">v7 저장, 확인 응답</text>

  <rect x="280" y="212" width="180" height="56" rx="8" fill="#f3f3f3" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="370" y="236" text-anchor="middle" class="b">노드 C</text>
  <text x="370" y="256" text-anchor="middle" class="s">죽어 있음, v6 그대로</text>

  <g stroke="#888" marker-end="url(#a)">
    <line x1="152" y1="154" x2="277" y2="86"/>
    <line x1="152" y1="162" x2="277" y2="162"/>
    <line x1="152" y1="170" x2="277" y2="238" stroke-dasharray="5 4"/>
  </g>
  <text x="30" y="302" class="s">3대 모두에 보내고, 2대가 확인하면 쓰기 성공</text>

  <!-- 읽기 -->
  <rect x="500" y="139" width="120" height="46" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="560" y="167" text-anchor="middle" class="b">클라이언트</text>

  <rect x="750" y="56" width="190" height="56" rx="8" fill="#f3f3f3" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="845" y="80" text-anchor="middle" class="b">노드 A</text>
  <text x="845" y="100" text-anchor="middle" class="s">v7, 응답이 늦어 빠짐</text>

  <rect x="750" y="134" width="190" height="56" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="845" y="158" text-anchor="middle" class="b r">노드 B</text>
  <text x="845" y="178" text-anchor="middle" class="s r">v7 응답 (최신)</text>

  <rect x="750" y="212" width="190" height="56" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="845" y="236" text-anchor="middle" class="b">노드 C</text>
  <text x="845" y="256" text-anchor="middle" class="s">v6 응답 (낡음)</text>

  <g stroke="#888" marker-end="url(#a)">
    <line x1="622" y1="154" x2="747" y2="86" stroke-dasharray="5 4"/>
    <line x1="622" y1="162" x2="747" y2="162"/>
    <line x1="622" y1="170" x2="747" y2="238"/>
  </g>
  <text x="500" y="302" class="s">쓴 {A, B}와 읽은 {B, C}가 B에서 겹친다. 버전이 큰 v7을 고른다</text>
</svg>
