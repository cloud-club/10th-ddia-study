<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#222}
    .t{font-size:17px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#666}
    .m{font-family:Menlo,Consolas,monospace;font-size:13px}.r{fill:#b3261e}
  </style>
  <rect width="960" height="330" fill="#fff"/>

  <text x="20" y="32" class="t">PostgreSQL: 로그 하나</text>
  <text x="500" y="32" class="t">MySQL (InnoDB): 로그 둘</text>
  <line x1="480" y1="16" x2="480" y2="316" stroke="#eee"/>

  <!-- PostgreSQL -->
  <rect x="30" y="140" width="110" height="44" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="85" y="167" text-anchor="middle" class="b">커밋</text>
  <rect x="185" y="140" width="140" height="44" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="255" y="167" text-anchor="middle" class="m r">WAL</text>
  <rect x="355" y="60" width="115" height="56" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="412" y="84" text-anchor="middle" class="b">장애 복구</text>
  <text x="412" y="104" text-anchor="middle" class="s">페이지에 재적용</text>
  <rect x="355" y="210" width="115" height="56" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="412" y="234" text-anchor="middle" class="b">레플리카</text>
  <text x="412" y="254" text-anchor="middle" class="s">바이트 그대로 재생</text>
  <g stroke="#888" marker-end="url(#a)">
    <line x1="142" y1="162" x2="182" y2="162"/>
    <line x1="327" y1="156" x2="352" y2="92"/>
    <line x1="327" y1="168" x2="352" y2="234"/>
  </g>
  <text x="30" y="300" class="s">WAL = 물리 로그: 어느 페이지의 어느 바이트를 바꿨나</text>

  <!-- MySQL -->
  <rect x="500" y="140" width="110" height="44" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="555" y="167" text-anchor="middle" class="b">커밋</text>
  <rect x="650" y="66" width="150" height="44" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="725" y="93" text-anchor="middle" class="m r">InnoDB redo log</text>
  <rect x="650" y="216" width="150" height="44" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="725" y="243" text-anchor="middle" class="m r">binlog</text>
  <line x1="725" y1="112" x2="725" y2="214" stroke="#b3261e" stroke-dasharray="4 4"/>
  <text x="735" y="167" class="s">내부 2PC로 맞춤</text>
  <rect x="828" y="60" width="115" height="56" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="885" y="84" text-anchor="middle" class="b">장애 복구</text>
  <text x="885" y="104" text-anchor="middle" class="s">페이지에 재적용</text>
  <rect x="828" y="210" width="115" height="56" rx="8" fill="#f3f3f3" stroke="#d4d4d4"/>
  <text x="885" y="234" text-anchor="middle" class="b">레플리카</text>
  <text x="885" y="254" text-anchor="middle" class="s">행 이벤트 재적용</text>
  <g stroke="#888" marker-end="url(#a)">
    <line x1="612" y1="156" x2="647" y2="92"/>
    <line x1="612" y1="168" x2="647" y2="236"/>
    <line x1="802" y1="88" x2="825" y2="88"/>
    <line x1="802" y1="238" x2="825" y2="238"/>
  </g>
  <text x="500" y="300" class="s">binlog = 논리 로그: 어느 테이블의 어느 행이 어떻게 바뀌었나</text>
</svg>
