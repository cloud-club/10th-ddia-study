  <line x1="110" y1="168" x2="270" y2="110" stroke="#5b6678" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="168" x2="320" y2="110" stroke="#5b6678" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="168" x2="370" y2="110" stroke="#5b6678" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="140" font-size="11" fill="#5b6678">외래 키 user_id로 users 참조</text>
  <text x="20" y="288" font-size="11" fill="#5b6678">사용자 1명 : 경력·학력·연락처 N개 (일대다) · 가상의 예시 데이터</text>
