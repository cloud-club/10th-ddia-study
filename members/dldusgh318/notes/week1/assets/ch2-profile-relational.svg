    <text x="320" y="187" text-anchor="middle" font-weight="700" fill="#ffffff">education (학력)</text>
    <text x="242" y="212">user_id: 101</text>
    <text x="242" y="230">school: 한빛대학교</text>
    <text x="242" y="248">start ~ end: 2019 ~ 2025</text>

    <rect x="440" y="170" width="180" height="92" rx="6" fill="#ffffff" stroke="#c2741a" stroke-width="1.5"/>
    <rect x="440" y="170" width="180" height="24" rx="6" fill="#c2741a"/>
    <text x="530" y="187" text-anchor="middle" font-weight="700" fill="#ffffff">contact_info (연락처)</text>
    <text x="452" y="212">user_id: 101</text>
