name: DDIA study dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and validate notes
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/validate_study.py
          node --test dashboard/*.test.js tests/*.test.cjs
          node --check dashboard/reader.js
          node --check dashboard/app.js
          node --check dashboard/graph.js
          node --check dashboard/dashboard-model.js
      - name: Build dashboard data
        run: python3 scripts/build_dashboard.py
        env:
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          DASHBOARD_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Verify static artifact
        run: python3 scripts/verify_dashboard.py
      - name: Browser regression tests
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload dashboard artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
